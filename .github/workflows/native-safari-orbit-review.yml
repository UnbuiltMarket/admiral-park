name: Native Safari orbit review
on:
  push:
    branches: [qa/native-safari-orbit-20261125]
    paths:
      - .github/workflows/native-safari-orbit-review.yml
      - qa/native-safari-orbit.py
      - qa/safari-followup.py
permissions:
  contents: read
jobs:
  safari:
    name: Safari on macOS
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Fetch the diagnostic from this exact commit
        env:
          SOURCE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/qa
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$SOURCE_BASE/native-safari-orbit.py" -o "$RUNNER_TEMP/qa.py"
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$SOURCE_BASE/safari-followup.py" -o "$RUNNER_TEMP/followup.py"
      - name: Exercise the published homepage in Apple Safari
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          /usr/bin/safaridriver --version
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver -p 4444 > "$RUNNER_TEMP/orbit-driver.log" 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP"
          python3 -u followup.py 2>&1 | tee orbit-qa.log
      - name: Keep the Safari observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-safari-results
          path: |
            ${{ runner.temp }}/orbit-qa.log
            ${{ runner.temp }}/orbit-driver.log
            ${{ runner.temp }}/safari-*.png
          retention-days: 7
